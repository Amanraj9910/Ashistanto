name: Build & Deploy to Azure Web App (Container)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_REGISTRY: ashistanto.azurecr.io
  IMAGE_NAME: ashistanto-image
  APP_NAME: hd-ashistanto-appservice
  RESOURCE_GROUP: rg_hd_Ashistanto

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  # =========================================================
  # BUILD & PUSH IMAGE TO ACR
  # =========================================================
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          tenant-id: ${{ secrets.MICROSOFT_TENANT_ID }}
          subscription-id: ${{ secrets.MICROSOFT_SUBSCRIPTION_ID }}

      - name: 🔑 Login to ACR
        run: az acr login --name ashistanto

      - name: 🐳 Build & Push Docker Image
        run: |
          docker build \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push \
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} 
             docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # =========================================================
  # DEPLOY TO AZURE WEB APP
  # =========================================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🔐 Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          tenant-id: ${{ secrets.MICROSOFT_TENANT_ID }}
          subscription-id: ${{ secrets.MICROSOFT_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          images: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: ⏳ Wait for App Startup
        run: sleep 40

      - name: 🏥 Health Check
        run: |
          BASE=https://ashistanto-bhc0fpeugkd9fqft.eastus-01.azurewebsites.net
          # /api/config alone is not sufficient: it is independent of the static UI mount and
          # answers 200 even when the Next export is missing, turning a broken deploy green.
          echo "Checking application health..."
          for i in {1..10}; do
            API=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/config" || echo "000")
            UI=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/" || echo "000")
            CHAT=$(curl -s -o /dev/null -w "%{http_code}" -L "$BASE/chat/" || echo "000")
            if [ "$API" = "200" ] && [ "$UI" = "200" ] && [ "$CHAT" = "200" ]; then
              echo "✅ App is healthy (api=$API ui=$UI chat=$CHAT)"
              exit 0
            fi
            echo "⏳ Attempt $i - api=$API ui=$UI chat=$CHAT"
            sleep 15
          done
          echo "❌ Health check failed"
          exit 1
