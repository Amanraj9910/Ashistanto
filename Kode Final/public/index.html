<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASHISTANTO</title>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
</head>

<body class="m-0 bg-[#0f172a]">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;

    const Icon = {
      logo: () => (
        <svg viewBox="0 0 24 24" className="h-9 w-9 text-red-600" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M12 3l8.5 17h-17L12 3z" />
          <path d="M12 8v5" />
          <circle cx="12" cy="17" r="1" fill="currentColor" stroke="none" />
        </svg>
      ),
      search: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4 text-slate-500" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="11" cy="11" r="6" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      ),
      menu: () => (
        <svg viewBox="0 0 24 24" className="h-5 w-5 text-slate-500" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      ),
      plus: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4 text-white" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M12 5v14M5 12h14" />
        </svg>
      ),
      dashboard: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z" />
        </svg>
      ),
      activity: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M12 2v6l4 2-4 2v6" />
          <path d="M5 12h14" />
        </svg>
      ),
      analytics: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M4 19V5" />
          <path d="M4 19h16" />
          <path d="M8 16v-5" />
          <path d="M12 16V8" />
          <path d="M16 16v-3" />
        </svg>
      ),
      automation: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2">
          <rect x="5" y="5" width="14" height="14" rx="2" />
          <path d="M9 9h6v6H9z" />
        </svg>
      ),
      support: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 17v.01" />
          <path d="M12 13.5a2.5 2.5 0 1 0-2.5-2.5" />
        </svg>
      ),
      chevron: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4 text-red-600" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M9 6l6 6-6 6" />
        </svg>
      ),
      calendar: () => (
        <svg viewBox="0 0 24 24" className="h-5 w-5 text-red-600" fill="none" stroke="currentColor" strokeWidth="2">
          <rect x="4" y="5" width="16" height="15" rx="2" />
          <path d="M8 3v4M16 3v4M4 9h16" />
        </svg>
      ),
      file: () => (
        <svg viewBox="0 0 24 24" className="h-5 w-5 text-red-600" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M7 3h7l5 5v13H7z" />
          <path d="M14 3v5h5" />
        </svg>
      ),
      wallet: () => (
        <svg viewBox="0 0 24 24" className="h-5 w-5 text-red-600" fill="none" stroke="currentColor" strokeWidth="2">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <path d="M16 12h4" />
        </svg>
      ),
      check: () => (
        <svg viewBox="0 0 24 24" className="h-9 w-9 text-emerald-500" fill="none" stroke="currentColor" strokeWidth="2.5">
          <circle cx="12" cy="12" r="9" />
          <path d="M8 12l2.5 2.5L16 9" />
        </svg>
      ),
      attachment: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4 text-slate-500" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M21 12.5l-8.5 8.5a5 5 0 1 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 5 5l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5" />
        </svg>
      ),
      send: () => (
        <svg viewBox="0 0 24 24" className="h-4 w-4 text-white" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M22 2L11 13" />
          <path d="M22 2l-7 20-4-9-9-4 20-7z" />
        </svg>
      )
    };

    function DashboardApp() {
      const [sessionId, setSessionId] = useState(null);
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [userEmail, setUserEmail] = useState('');
      const [userFirstName, setUserFirstName] = useState('User');
      const [userPhoto, setUserPhoto] = useState(null);
      const [search, setSearch] = useState('');

      useEffect(() => {
        const checkLogin = async () => {
          const storedSessionId = localStorage.getItem('userSessionId');
          if (!storedSessionId) {
            setIsLoggedIn(true);
            return;
          }

          try {
            const response = await fetch(`/auth/session-token/${storedSessionId}`);
            if (!response.ok) {
              setIsLoggedIn(true);
              return;
            }

            setSessionId(storedSessionId);
            setIsLoggedIn(true);

            const profileResponse = await fetch(`/api/user-profile?sessionId=${storedSessionId}`);
            if (profileResponse.ok) {
              const profileData = await profileResponse.json();
              if (profileData.email) setUserEmail(profileData.email);
              if (profileData.firstName) setUserFirstName(profileData.firstName);
            }

            const photoResponse = await fetch(`/api/user-photo?sessionId=${storedSessionId}`);
            if (photoResponse.ok) {
              const blob = await photoResponse.blob();
              if (blob.size > 0) setUserPhoto(URL.createObjectURL(blob));
            }
          } catch (err) {
            setIsLoggedIn(true);
          }
        };

        checkLogin();
      }, []);

      const handleLogout = async () => {
        try {
          if (sessionId) {
            await fetch('/auth/logout', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionId })
            });
          }
        } finally {
          localStorage.removeItem('userSessionId');
          setSessionId(null);
          setUserEmail('');
          setUserFirstName('User');
          setUserPhoto(null);
        }
      };

      const capabilities = [
        { icon: Icon.calendar, title: 'Leave Management', desc: '"Apply for 3 days of annual leave starting next Monday."' },
        { icon: Icon.wallet, title: 'Expense Submission', desc: '"Log a $45 client lunch with Acme Corp yesterday."' },
        { icon: Icon.calendar, title: 'Calendar Operations', desc: '"Schedule a 30m sync with the design team tomorrow."' },
        { icon: Icon.file, title: 'Document Drafting', desc: '"Draft a Q3 summary report based on last week\'s data."' }
      ];

      const navItems = [
        { icon: Icon.dashboard, label: 'Dashboard', active: true },
      ];

      return (
        <div className="min-h-screen w-full bg-[#111111]">
          <div className="grid min-h-screen w-full grid-cols-1 lg:grid-cols-[272px_minmax(0,1fr)]">
            <aside className="flex min-h-screen flex-col border-r border-slate-200 bg-white px-4 py-6">
                <div className="flex items-center gap-2 px-1">
                  <Icon.logo />
                  <div className="text-[15px] font-bold tracking-[0.18em] text-red-600">ASHISTANTO</div>
                </div>

                <button className="mt-7 flex items-center justify-center gap-2 rounded-md bg-red-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-red-700">
                  <Icon.plus />
                  New Session
                </button>

                <nav className="mt-6 flex flex-1 flex-col gap-2">
                  {navItems.map((item) => (
                    <div
                      key={item.label}
                      className={`flex items-center gap-3 rounded-md px-4 py-3 text-sm ${
                        item.active ? 'bg-slate-200 font-semibold text-slate-950' : 'text-slate-600'
                      }`}
                    >
                      <span className={item.active ? 'text-slate-950' : 'text-slate-500'}>
                        <item.icon />
                      </span>
                      <span>{item.label}</span>
                    </div>
                  ))}
                </nav>

                <div className="mt-auto space-y-3 pt-6">
                  <div className="flex items-center gap-3 rounded-md px-4 py-3 text-sm text-slate-600">
                    <Icon.support />
                    <span>Help &amp; Support</span>
                  </div>
                  <div className="border-t border-slate-200" />
                  <div className="flex items-center gap-3 px-3 py-2">
                    <img
                      src={userPhoto || 'https://placehold.co/40x40'}
                      alt="Profile"
                      className="h-10 w-10 rounded-full border border-slate-200 object-cover"
                    />
                    <div className="min-w-0 flex-1">
                      <div className="truncate text-sm font-semibold text-slate-950">{userFirstName}</div>
                      <div className="truncate text-xs font-medium uppercase tracking-wide text-slate-500">
                        {userEmail || 'Director of Ops'}
                      </div>
                    </div>
                    <button onClick={handleLogout} className="text-slate-500 transition hover:text-slate-900" aria-label="Logout">
                      ↗
                    </button>
                  </div>
                </div>
              </aside>

            <main className="grid min-h-screen min-w-0 grid-cols-1 bg-gradient-to-br from-slate-50 to-slate-100">
              <div className="col-span-full flex min-h-0 flex-col border-b border-slate-200 px-4 py-6 sm:px-6 md:px-8 lg:pl-6 lg:pr-10 xl:pl-10 xl:pr-12">
                <div className="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
                  <div>
                    <h1 className="text-3xl font-extrabold tracking-tight text-slate-950 sm:text-4xl md:text-5xl">
                      Good morning, {userFirstName}.
                    </h1>
                    <p className="mt-2 max-w-2xl text-sm text-slate-600 sm:text-base md:text-lg">
                      Your enterprise assistant is ready to streamline today&apos;s operations.
                    </p>
                  </div>

                  <label className="relative w-full max-w-none lg:max-w-[264px]">
                    <span className="pointer-events-none absolute inset-y-0 left-4 flex items-center">
                      <Icon.search />
                    </span>
                    <input
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      placeholder="Search enterprise data..."
                      className="w-full rounded-full border border-slate-200 bg-white py-2.5 pl-10 pr-4 text-sm text-slate-700 shadow-[inset_0_2px_4px_1px_rgba(0,0,0,0.05)] outline-none transition focus:border-slate-300"
                    />
                  </label>
                </div>
              </div>

              <section className="flex min-h-0 flex-1 flex-col overflow-hidden">
                <div className="flex-1 overflow-auto px-4 pb-6 pt-6 sm:px-6 md:px-8 lg:px-8 xl:px-10">
                  <div className="grid gap-6 xl:grid-cols-[minmax(0,1fr)_360px]">
                    <div className="space-y-6">
                      <div className="w-full rounded-xl border border-slate-200 bg-white p-5 shadow-[0_4px_20px_rgba(14,42,71,0.04)] sm:p-8">
                        <div className="flex items-center justify-between gap-4">
                          <h2 className="text-xl font-semibold text-slate-950 sm:text-2xl">Enterprise Capabilities</h2>
                          <a href="#" className="flex items-center gap-1 text-sm font-semibold text-red-600">
                            View all integrations
                            <Icon.chevron />
                          </a>
                        </div>

                        <p className="mt-4 max-w-xl text-sm leading-6 text-slate-600 md:text-base">
                          Execute complex workflows directly through natural language processing in the assistant.
                        </p>

                        <div className="mt-6 grid gap-3 sm:grid-cols-2">
                          {capabilities.map((card) => (
                            <div key={card.title} className="rounded-xl border border-slate-200 bg-slate-50 p-5">
                              <div className="flex h-10 w-10 items-center justify-center rounded-lg bg-red-50">
                                <card.icon />
                              </div>
                              <h3 className="mt-4 text-base font-semibold text-slate-950">{card.title}</h3>
                              <p className="mt-2 text-sm leading-5 text-slate-600">{card.desc}</p>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="grid gap-3 sm:grid-cols-3">
                        <div className="rounded-xl border border-slate-200 bg-white p-5 shadow-[0_4px_20px_rgba(14,42,71,0.04)]">
                          <Icon.calendar />
                          <div className="mt-4 text-3xl font-bold text-slate-950">12</div>
                          <div className="mt-1 text-xs font-semibold uppercase tracking-wide text-slate-500">Pending Tasks</div>
                        </div>
                        <div className="rounded-xl border border-slate-200 bg-white p-5 shadow-[0_4px_20px_rgba(14,42,71,0.04)]">
                          <svg viewBox="0 0 24 24" className="h-5 w-5 text-slate-950" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M4 6h16v12H4z" />
                            <path d="M4 10h16" />
                            <path d="M8 6v-2M16 6v-2" />
                          </svg>
                          <div className="mt-4 text-3xl font-bold text-slate-950">5</div>
                          <div className="mt-1 text-xs font-semibold uppercase tracking-wide text-slate-500">Unread Memos</div>
                        </div>
                        <div className="relative overflow-hidden rounded-xl border border-slate-200 bg-white p-5 shadow-[0_4px_20px_rgba(14,42,71,0.04)]">
                          <div className="absolute -right-6 -top-6 h-24 w-24 rounded-full bg-emerald-500/10 blur-2xl" />
                          <div className="flex items-start justify-between gap-3">
                            <div>
                              <h3 className="text-2xl font-semibold text-slate-950">System Health</h3>
                              <p className="mt-1 text-sm text-slate-600">All enterprise services operational</p>
                            </div>
                            <Icon.check />
                          </div>
                        </div>
                      </div>
                    </div>

                    <aside className="min-h-0 w-full rounded-xl border border-slate-200 bg-white shadow-[0_4px_20px_rgba(14,42,71,0.04)] xl:sticky xl:top-0 xl:h-[calc(100vh-2rem)]">
                      <div className="flex items-center justify-between border-b border-slate-200 px-5 py-4">
                        <div className="flex items-center gap-3">
                          <div className="flex h-8 w-8 items-center justify-center rounded-sm bg-red-600 text-white">
                            <Icon.logo />
                          </div>
                          <div>
                            <div className="text-sm font-bold text-slate-950">ASHISTANTO AI</div>
                            <div className="text-xs font-semibold uppercase tracking-wide text-orange-500">Online</div>
                          </div>
                        </div>
                        <button className="text-slate-500">
                          <Icon.menu />
                        </button>
                      </div>

                      <div className="flex max-h-none flex-1 flex-col gap-4 overflow-auto bg-slate-50 px-4 py-5 xl:max-h-[calc(100vh-164px-2rem)]">
                        <div className="flex justify-center">
                          <span className="rounded-full bg-slate-200 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-600">
                            Today, 9:41 AM
                          </span>
                        </div>

                        <div className="flex items-start gap-3">
                          <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-red-600 text-white">
                            <Icon.logo />
                          </div>
                          <div className="max-w-[240px] rounded-br-2xl rounded-tr-2xl rounded-bl-2xl border border-white/30 bg-white/90 px-3 py-3 text-sm leading-5 text-slate-950 shadow-sm backdrop-blur">
                            Good morning! I&apos;ve reviewed your schedule. You have a budget review at 11:00 AM. Would you like me to prepare the preliminary expense report?
                          </div>
                        </div>

                        <div className="flex items-start justify-end gap-3">
                          <div className="max-w-[240px] rounded-bl-2xl rounded-tr-2xl rounded-tl-2xl bg-slate-950 px-4 py-3 text-sm leading-5 text-white shadow-sm">
                            Yes, please. Also, log a sick day for Sarah Jenkins starting today.
                          </div>
                          <img
                            src={userPhoto || 'https://placehold.co/32x32'}
                            alt="User"
                            className="h-8 w-8 rounded-full border border-slate-200 object-cover"
                          />
                        </div>

                        <div className="flex items-start gap-3">
                          <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-red-600 text-white">
                            <Icon.logo />
                          </div>
                          <div className="max-w-[280px] rounded-br-2xl rounded-tr-2xl rounded-bl-2xl border border-white/30 bg-white/90 p-3 text-sm leading-5 text-slate-950 shadow-sm backdrop-blur">
                            I&apos;ve generated the expense report and logged the sick leave for Sarah Jenkins.
                            <div className="mt-3 rounded-lg border border-slate-200 bg-white p-3 text-xs text-slate-600">
                              <div className="flex items-center gap-2">
                                <span className="rounded bg-orange-500/10 px-1.5 py-0.5 font-semibold text-orange-500">Leave</span>
                                <span className="font-semibold text-slate-950">Processed</span>
                              </div>
                              <div className="mt-2 leading-4">Employee: Sarah Jenkins</div>
                              <div className="leading-4">Type: Sick Leave</div>
                              <div className="leading-4">Status: <span className="text-emerald-500">Approved &amp; Calendar Updated</span></div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="border-t border-slate-200 bg-white p-4">
                        <div className="flex items-end gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 shadow-[inset_0_2px_4px_1px_rgba(0,0,0,0.05)]">
                          <button className="rounded-lg p-2 text-slate-500 hover:bg-slate-100">
                            <Icon.attachment />
                          </button>
                          <input
                            placeholder="Type a command or ask a question..."
                            className="min-w-0 flex-1 bg-transparent py-2 text-sm outline-none placeholder:text-slate-500"
                          />
                          <button className="rounded-lg bg-red-600 p-2 text-white shadow-sm hover:bg-red-700">
                            <Icon.send />
                          </button>
                        </div>
                      </div>
                    </aside>
                  </div>
                </div>
              </section>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>

</html>
